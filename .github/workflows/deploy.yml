name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        env:
          # Ordem de prioridade:
          #   1. Variable VITE_PLATE_API_BASE (Settings > Secrets and variables > Actions > Variables)
          #   2. Secret VITE_PLATE_API_BASE (caso tenha sido criado como secret)
          #   3. Backend padrão do projeto (URL pública, não é segredo)
          VITE_PLATE_API_BASE: ${{ vars.VITE_PLATE_API_BASE || secrets.VITE_PLATE_API_BASE || 'https://fipefacil-api.onrender.com' }}
        run: |
          cd frontend
          echo "Build usando VITE_PLATE_API_BASE=$VITE_PLATE_API_BASE"
          npm run build
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
